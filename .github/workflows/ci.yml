name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Format
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Engine tests
        run: dotnet test --no-build --configuration Release --project tests/OutreachStudio.Engine.Tests

      - name: Worker tests (Testcontainers, includes the exactly-once concurrency test)
        run: dotnet test --no-build --configuration Release --project tests/OutreachStudio.Worker.Tests
